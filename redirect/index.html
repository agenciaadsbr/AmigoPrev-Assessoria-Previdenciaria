<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Abrindo o WhatsApp — AmigoPrev</title>
<meta name="theme-color" content="#021A32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#021A32;color:#FFFFFF;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;position:relative;overflow:hidden}
.glow{position:absolute;right:-200px;top:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(231,79,61,.22),rgba(231,79,61,0) 65%)}
.box{max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;position:relative}
.logo{font-family:Montserrat,sans-serif;font-weight:800;font-size:32px;letter-spacing:-.8px}
.logo span{color:#E74F3D}
.ring{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Montserrat,sans-serif;font-weight:800;font-size:46px;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:#E74F3D;stroke-linecap:round;stroke-dasharray:339;stroke-dashoffset:0;animation:dash 3s linear forwards}
@keyframes dash{to{stroke-dashoffset:339}}
h1{margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-1px}
p{margin:0;font-size:17px;line-height:1.6;color:#C6D0DA}
a.cta{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:0 28px;border-radius:999px;background:#25D366;color:#FFFFFF;text-decoration:none;font-family:Montserrat,sans-serif;font-weight:700;font-size:16px;transition:transform .2s}
a.cta:hover{transform:translateY(-2px)}
a.cta:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.ring .fg{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="glow" aria-hidden="true"></div>
<div class="box" role="status" aria-live="polite">
<div class="logo">Amigo<span>Prev</span></div>
<div class="ring"><svg viewBox="0 0 112 112" aria-hidden="true"><circle class="bg" cx="56" cy="56" r="54"/><circle class="fg" cx="56" cy="56" r="54"/></svg><span id="count">3</span></div>
<h1 id="title">Recebemos seus dados!</h1>
<p id="msg">Estamos abrindo o WhatsApp para você falar com um especialista da AmigoPrev.</p>
<a id="walink" class="cta" href="#">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>
Abrir o WhatsApp agora</a>
</div>
</div>
<script>
var WHATSAPP='5534984221619';
(function(){
  var nome='';try{nome=sessionStorage.getItem('lp_nome')||''}catch(e){}
  if(nome)document.getElementById('title').textContent='Recebemos seus dados, '+nome+'!';
  var MSG='Olá! '+(nome?'Meu nome é '+nome+'. ':'')+'Vim pela página da AmigoPrev e quero uma análise gratuita do meu caso.';
  var url='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(MSG);
  var a=document.getElementById('walink'),el=document.getElementById('count'),m=document.getElementById('msg'),c=3;
  a.href=url;
  var t=setInterval(function(){c--;el.textContent=Math.max(c,0);if(c<=0){clearInterval(t);m.textContent='Se o WhatsApp não abriu automaticamente, toque no botão abaixo.';location.href=url;}},1000);
})();
</script>
</body>
</html>
